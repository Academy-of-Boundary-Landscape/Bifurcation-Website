name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # 后端：检查 + 构建 Docker 镜像
  # ========================================
  backend:
    name: Backend Check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy SARIF 上传到 Security 页需要
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r requirements-dev.txt --quiet

      - name: Compile check
        run: |
          ./venv/bin/python -c "
          import py_compile, glob, sys
          files = glob.glob('app/**/*.py', recursive=True) + ['main.py']
          fails = []
          for f in sorted(files):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  fails.append(str(e))
          if fails:
              for f in fails:
                  print(f, file=sys.stderr)
              sys.exit(1)
          print(f'All {len(files)} files compiled OK')
          "

      - name: Import check
        run: |
          ./venv/bin/python -c "
          import sys
          try:
              from app.core.config import settings
              from app.api.api import api_router
              from app.models.user import User, UserRole
              from app.models.story import StoryNode, NodeLike
              from app.models.story_book import StoryBook
              from app.models.interaction import StoryComment, Notification
              from app.services.sso import exchange_sso_code, build_sso_login_url
              print('All module imports OK')
          except Exception as e:
              print(f'Import failed: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Run tests
        run: APP_ENV=dev ./venv/bin/python -m pytest -q

      # Docker 镜像构建 + 推送（仅 push main）
      # setup-buildx 提供 docker-container driver——gha 缓存导出（cache-to）必须用它，
      # runner 默认的 docker driver 不支持，否则 build 会报 "Cache export is not supported"。
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 需同时配齐 vars.ACR_REGISTRY + vars.ACR_NAMESPACE 与 secrets.ACR_USERNAME/ACR_PASSWORD；
      # 任一缺失则整段 ACR 跳过，退回只推 GHCR（不破坏现有流水线）。
      - name: Log in to Aliyun ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ACR_REGISTRY != '' && vars.ACR_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Lowercase owner name
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute image tags
        id: meta
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LC}/bifurcation-backend:latest"
            echo "ghcr.io/${OWNER_LC}/bifurcation-backend:${{ github.sha }}"
            if [ -n "${{ vars.ACR_REGISTRY }}" ] && [ -n "${{ vars.ACR_NAMESPACE }}" ]; then
              echo "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/bifurcation-backend:latest"
              echo "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/bifurcation-backend:${{ github.sha }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像 CVE 扫描（只报告）：扫刚推上去的 SHA 镜像基础层漏洞，永不 fail
      - name: Scan image with Trivy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/bifurcation-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'        # 只报告，不让 job 失败
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to Security tab
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ========================================
  # 前端：检查 + 构建 + 上传产物
  # ========================================
  frontend:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build-only

      # 上传 dist/ 供 deploy job 使用
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ========================================
  # CD：镜像已推送，部署到生产服务器
  # 仅在 push main 时触发
  # ========================================
  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 拿到前端构建产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # rsync 前端静态文件到服务器
      - name: Deploy frontend via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /home/deploy/Bifurcation-Website/frontend/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # SSH 执行后端部署脚本（docker compose pull + up）
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          # 默认 10 分钟；网络抽风时镜像拉取可能更慢
          command_timeout: 30m
          script: |
            cd /home/deploy/Bifurcation-Website
            git fetch origin main
            git pull --ff-only origin main
            bash deploy/deploy.sh

      # 远程健康检查
      - name: Remote health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            sleep 5
            curl -sf --max-time 10 http://127.0.0.1:8057/health > /dev/null
            echo "Health check passed"
