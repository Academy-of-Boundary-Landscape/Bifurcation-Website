# ==============================================================
# Bifurcation — Nginx 配置示例
# 放置路径示例：/etc/nginx/sites-available/bifurcation
# 启用：ln -s /etc/nginx/sites-available/bifurcation /etc/nginx/sites-enabled/
# 重载：nginx -t && systemctl reload nginx
#
# 前置要求：
#   - 已用 certbot 申请证书（certbot --nginx -d your-domain.com）
#   - 前端已构建（npm run build），产物在 frontend/dist/
#   - 后端已通过 PM2 启动，监听 127.0.0.1:8057
# ==============================================================

# ==============================================================
# 🚦 写操作限流（仅 POST/PUT/PATCH/DELETE 按 IP 计数；GET 等读请求放过）
#    map 给读请求一个空字符串 key —— nginx 对空 key 不计数，等于跳过限流。
#    放在 http 上下文（sites-enabled 文件顶部即 http 上下文）。
# ==============================================================
map $request_method $api_write_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $api_write_key zone=api_write:10m rate=20r/s;
limit_req_status 429;

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name bifurcation.secret-sealing.club;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bifurcation.secret-sealing.club;

    # ----------------------------------------------------------
    # SSL（由 certbot 自动填写，或手动替换路径）
    # ----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/bifurcation.secret-sealing.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bifurcation.secret-sealing.club/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ----------------------------------------------------------
    # 前端静态文件（Vue 构建产物）
    # ----------------------------------------------------------
    root /path/to/Bifurcation-Website/frontend/dist;
    index index.html;

    # SPA 路由：所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（Vite 产物带内容 hash，可安全缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------
    # 拦截扫描机器人常探测的路径，直接 444 关闭连接（不返回任何响应）
    # ----------------------------------------------------------
    location ~* ^/api/v1/(\.env|config(\.map)?|settings|\.git|backup|phpinfo) {
        return 444;
    }

    # ----------------------------------------------------------
    # API 反代到后端
    # ----------------------------------------------------------
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8057;

        # 写操作粗挡：突发允许 40，平滑放行；读请求 key 为空不受影响
        limit_req zone=api_write burst=40 nodelay;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传接口允许较大文件（与后端 5MB 限制对齐，留一点余量）
        client_max_body_size 8m;

        # 超时（默认 60s，根据实际情况调整）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ----------------------------------------------------------
    # 上传文件静态服务（由后端直接 serve 的 /static/ 路径）
    # ----------------------------------------------------------
    location /static/ {
        proxy_pass       http://127.0.0.1:8057;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # ----------------------------------------------------------
    # 安全 headers（可选，建议开启）
    # ----------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------
    # Gzip 压缩
    # ----------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ----------------------------------------------------------
    # 日志
    # ----------------------------------------------------------
    access_log /var/log/nginx/bifurcation.secret-sealing.club-access.log;
    error_log  /var/log/nginx/bifurcation.secret-sealing.club-error.log warn;
}
